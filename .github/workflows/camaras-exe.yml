name: Cámaras (.exe)

on:
  push:
    branches: [main]
    paths: ['tools/camaras/**', '.github/workflows/camaras-exe.yml']
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bajar go2rtc y cloudflared (versiones oficiales)
        working-directory: tools/camaras
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/AlexxIT/go2rtc/releases/latest/download/go2rtc_win64.zip -OutFile go2rtc.zip
          Expand-Archive go2rtc.zip -DestinationPath go2rtc_tmp -Force
          Copy-Item (Get-ChildItem go2rtc_tmp -Recurse -Filter go2rtc.exe | Select-Object -First 1).FullName go2rtc.exe
          Invoke-WebRequest https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile cloudflared.exe
          .\go2rtc.exe -version
          .\cloudflared.exe --version
      - name: Compilar
        working-directory: tools/camaras
        run: >
          python -m pip install pyinstaller==6.11.1 &&
          pyinstaller --noconfirm --onefile --console --uac-admin
          --name CamarasEvolution
          --add-binary "go2rtc.exe;."
          --add-binary "cloudflared.exe;."
          camaras.py
      - name: Probar que arranca
        working-directory: tools/camaras
        shell: pwsh
        run: |
          # sin config.json el servicio tiene que salir con el aviso (no colgarse)
          New-Item -ItemType Directory -Force prueba | Out-Null
          Copy-Item dist\CamarasEvolution.exe prueba\
          $p = Start-Process prueba\CamarasEvolution.exe -ArgumentList '--servicio' -NoNewWindow -PassThru -Wait -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Get-Content out.txt, err.txt
          if (-not (Select-String -Path out.txt, err.txt, prueba\camaras.log -Pattern 'config.json' -Quiet)) { throw 'el .exe no arranca bien' }
      - uses: actions/upload-artifact@v4
        with:
          name: CamarasEvolution
          path: tools/camaras/dist/CamarasEvolution.exe
          retention-days: 30

<!doctype html>
<html lang="es">
<body style="margin:0;padding:0;background:#09090b;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#09090b;padding:32px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#18181b;border:1px solid #27272a;border-radius:20px;">
        <tr><td style="padding:28px 28px 8px;text-align:center;">
          <div style="font-size:13px;letter-spacing:2px;color:#edcc36;font-weight:bold;">EVOLUTION FITNESS GYM</div>
        </td></tr>
        <tr><td style="padding:8px 28px 0;text-align:center;">
          <h1 style="margin:0;font-size:22px;line-height:1.3;color:#ffffff;">Cambiar tu contraseña</h1>
          <p style="margin:12px 0 0;font-size:15px;line-height:1.5;color:#a1a1aa;">Recibimos un pedido para cambiar la contraseña de tu cuenta. Tocá el botón para elegir una nueva.</p>
        </td></tr>
        <tr><td style="padding:24px 28px;text-align:center;">
          <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next={{ .RedirectTo }}" style="display:inline-block;background:#edcc36;color:#000000;text-decoration:none;font-weight:bold;font-size:16px;padding:14px 28px;border-radius:12px;">Elegir contraseña nueva</a>
        </td></tr>
        <tr><td style="padding:0 28px 28px;text-align:center;">
          <p style="margin:0;font-size:12px;line-height:1.5;color:#71717a;">Si no lo pediste, ignorá este email: tu contraseña sigue igual.</p>
        </td></tr>
      </table>
      <p style="margin:16px 0 0;font-size:11px;color:#52525b;">Evolution Fitness GYM · Pilar</p>
    </td></tr>
  </table>
</body>
</html>
